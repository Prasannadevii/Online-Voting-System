<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register | NetVote</title><meta name="description" content="NetVote - academic Computer Networks and Operating Systems voting demonstration">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232456e6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/style.css"><link rel="stylesheet" href="/static/css/dashboard.css"><link rel="stylesheet" href="/static/css/voting.css"><link rel="stylesheet" href="/static/css/responsive.css">
</head><body data-layout="public" data-require="" data-page="register">
<main id="main">

<div class="auth-box"><div class="card"><h1>Register to vote</h1>
<form id="reg-form" novalidate>
<div class="field"><label for="voter_id">Voter ID</label><input id="voter_id" required minlength="3" maxlength="20"><div class="hint">3-20 letters, digits, - or _</div><div class="field-error" data-for="voter_id"></div></div>
<div class="field"><label for="name">Full name</label><input id="name" required autocomplete="name"><div class="field-error" data-for="name"></div></div>
<div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"><div class="field-error" data-for="email"></div></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="new-password"><div class="hint">At least 8 characters with a letter and a digit. Stored only as a salted PBKDF2 hash.</div><div class="field-error" data-for="password"></div></div>
<div class="field"><label for="confirm_password">Confirm password</label><input id="confirm_password" type="password" required autocomplete="new-password"><div class="field-error" data-for="confirm_password"></div></div>
<div id="form-msg" class="field-error" role="alert"></div>
<button class="btn btn-primary" type="submit" id="submit-btn">Register</button> <a class="btn btn-ghost" href="login.html">I have an account</a></form></div></div>
</main>
<script src="/static/js/core.js"></script>
<script src="/static/js/charts.js"></script>
<script src="/static/js/voter.js"></script>
</body></html>

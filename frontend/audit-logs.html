<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audit Logs | NetVote</title><meta name="description" content="NetVote - academic Computer Networks and Operating Systems voting demonstration">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232456e6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/style.css"><link rel="stylesheet" href="/static/css/dashboard.css"><link rel="stylesheet" href="/static/css/voting.css"><link rel="stylesheet" href="/static/css/responsive.css">
</head><body data-layout="admin" data-require="admin" data-page="audit-logs">
<main id="main">

<div class="page-head"><div><h1>Audit logs</h1><p>Security-relevant events with the Request ID that ties each one to a network request.</p></div><button class="btn" id="refresh">Refresh</button></div>
<form id="filters" class="card card-flat" style="margin-bottom:1rem"><div class="inline-fields">
<div><label for="f-action">Action</label><select id="f-action"><option value="">All</option></select></div>
<div><label for="f-user">User</label><input id="f-user" placeholder="e.g. 10003"></div>
<div><label for="f-sev">Severity</label><select id="f-sev"><option value="">All</option><option>INFO</option><option>WARNING</option><option>ERROR</option></select></div>
<div><label for="f-from">From</label><input id="f-from" type="date"></div><div><label for="f-to">To</label><input id="f-to" type="date"></div>
<div style="flex:none"><button class="btn btn-primary" type="submit">Apply</button> <button class="btn" type="button" id="f-reset">Reset</button></div></div></form>
<div class="table-wrap"><table><thead><tr><th>Timestamp</th><th>User</th><th>Action</th><th>Request ID</th><th>IP</th><th>Status</th><th>Details</th></tr></thead><tbody id="abody"></tbody></table></div>
<div class="btn-row" style="margin-top:.8rem"><button class="btn btn-sm" id="prev">Previous</button><button class="btn btn-sm" id="next">Next</button><span class="small muted" id="acount"></span></div>
</main>
<script src="/static/js/core.js"></script>
<script src="/static/js/charts.js"></script>
<script src="/static/js/admin.js"></script>
</body></html>

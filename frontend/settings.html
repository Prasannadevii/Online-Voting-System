<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings | NetVote</title><meta name="description" content="NetVote - academic Computer Networks and Operating Systems voting demonstration">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232456e6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/style.css"><link rel="stylesheet" href="/static/css/dashboard.css"><link rel="stylesheet" href="/static/css/voting.css"><link rel="stylesheet" href="/static/css/responsive.css">
</head><body data-layout="admin" data-require="admin" data-page="settings">
<main id="main">

<div class="page-head"><div><h1>Settings</h1><p>Runtime configuration (read-only, from .env) and admin password.</p></div></div>
<div class="grid g2"><div class="card"><h3>Server configuration</h3><dl class="kv" id="cfg"></dl></div>
<div class="card"><h3>Change admin password</h3><form id="pw-form" class="stack"><div class="field"><label for="cur">Current password</label><input id="cur" type="password" autocomplete="current-password" required></div>
<div class="field"><label for="new">New password</label><input id="new" type="password" autocomplete="new-password" required><div class="hint">8+ characters, letters and digits.</div></div><div id="pw-err" class="field-error" role="alert"></div><button class="btn btn-primary" type="submit">Change password</button></form></div></div>
</main>
<script src="/static/js/core.js"></script>
<script src="/static/js/charts.js"></script>
<script src="/static/js/admin.js"></script>
</body></html>

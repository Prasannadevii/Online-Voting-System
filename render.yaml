services:
  - type: web
    name: netvote-online-voting
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn \"app:create_app()\" --workers 1 --threads 8 --timeout 120"
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: HOST
        value: "0.0.0.0"
